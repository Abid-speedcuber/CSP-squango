<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cale Parity Workflow Inspector</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f5f7fb;
      --panel: #ffffff;
      --text: #182033;
      --muted: #5d697d;
      --border: #d8deea;
      --accent: #2457d6;
      --code: #101828;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #111827;
        --panel: #1f2937;
        --text: #f3f4f6;
        --muted: #aeb8c8;
        --border: #374151;
        --accent: #7aa2ff;
        --code: #f9fafb;
      }
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      display: flex;
      justify-content: center;
      padding: 32px 16px;
    }

    main {
      width: min(920px, 100%);
    }

    h1 {
      font-size: 1.35rem;
      margin: 0 0 16px;
      font-weight: 700;
    }

    .panel {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 16px;
    }

    textarea {
      width: 100%;
      min-height: 112px;
      resize: vertical;
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 12px;
      color: var(--text);
      background: transparent;
      font: 0.95rem/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }

    .actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      align-items: center;
      margin-top: 12px;
    }

    select {
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 8px 10px;
      background: transparent;
      color: var(--text);
      font: inherit;
    }

    button {
      border: 1px solid var(--accent);
      background: var(--accent);
      color: white;
      border-radius: 6px;
      padding: 8px 12px;
      font-weight: 650;
      cursor: pointer;
    }

    button.secondary {
      background: transparent;
      color: var(--accent);
    }

    label {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: var(--text);
      font-size: 0.95rem;
      user-select: none;
    }

    pre {
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      margin: 16px 0 0;
      padding: 16px;
      border-radius: 8px;
      border: 1px solid var(--border);
      color: var(--code);
      background: color-mix(in srgb, var(--panel), var(--bg) 45%);
      font: 0.93rem/1.55 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }

    .note {
      margin-top: 10px;
      color: var(--muted);
      font-size: 0.9rem;
      line-height: 1.45;
    }
  </style>
</head>
<body>
  <main>
    <h1>Cale Parity Workflow Inspector</h1>
    <section class="panel">
      <textarea id="scrambleInput" spellcheck="false">(0,-4)/ (3,0)/ (-5,1)/ (6,-3)/ (5,-4)/ (3,0)/ (1,0)/ (-3,0)/ (0,-2)/ (0,-1)/ (3,-2)/ (-2,0)/ (6,-4)</textarea>
      <div class="actions">
        <select id="cornerMode" aria-label="Corner sticker mode">
          <option value="counter-clockwise">counter-clockwise corners</option>
          <option value="clockwise">clockwise corners</option>
        </select>
        <label>
          <input id="z2TracingMode" type="checkbox" checked>
          z2 tracing mode
        </label>
        <select id="bottomMode" aria-label="Bottom de-duplication mode">
          <option value="intended">intended bottom de-dup</option>
          <option value="refactor-current">old refactor bottom de-dup</option>
        </select>
        <button id="runBtn" type="button">Run workflow</button>
        <button id="copyBtn" class="secondary" type="button">Copy output</button>
      </div>
      <pre id="output"></pre>
      <div class="note">This is a diagnostic page only. It does not call or modify the production parity tracer.</div>
    </section>
  </main>

  <script>
    const CORNER_HEX = new Set(['1', '3', '5', '7', '9', 'b', 'd', 'f']);
    const TOP_HEX = new Set(['0', '1', '2', '3', '4', '5', '6', '7']);
    const TOP_EDGES = new Set(['0', '2', '4', '6']);
    const BOTTOM_EDGES = new Set(['8', 'a', 'c', 'e']);
    const TOP_CORNERS = new Set(['1', '3', '5', '7']);
    const BOTTOM_CORNERS = new Set(['9', 'b', 'd', 'f']);

    const hexToColorsCCW = {
      '0': 'O', '2': 'B', '4': 'R', '6': 'G',
      '8': 'G', 'a': 'R', 'c': 'B', 'e': 'O',
      '1': 'B', '3': 'R', '5': 'G', '7': 'O',
      '9': 'G', 'b': 'R', 'd': 'B', 'f': 'O'
    };

    const hexToColorsCW = {
      '0': 'O', '2': 'B', '4': 'R', '6': 'G',
      '8': 'G', 'a': 'R', 'c': 'B', 'e': 'O',
      '1': 'O', '3': 'B', '5': 'R', '7': 'G',
      '9': 'O', 'b': 'G', 'd': 'R', 'f': 'B'
    };

    const blackEdgeParityMap = {
      '0246': 0, '0264': 1, '0426': 1, '0462': 0, '0624': 0, '0642': 1,
      '2046': 1, '2064': 0, '2406': 0, '2460': 1, '2604': 1, '2640': 0,
      '4026': 0, '4062': 1, '4206': 1, '4260': 0, '4602': 0, '4620': 1,
      '6024': 1, '6042': 0, '6204': 0, '6240': 1, '6402': 1, '6420': 0
    };

    const whiteEdgeParityMap = {
      '8ace': 1, '8aec': 0, '8cae': 0, '8cea': 1, '8eac': 1, '8eca': 0,
      'a8ce': 0, 'a8ec': 1, 'ac8e': 1, 'ace8': 0, 'ae8c': 0, 'aec8': 1,
      'c8ae': 1, 'c8ea': 0, 'ca8e': 0, 'cae8': 1, 'ce8a': 1, 'cea8': 0,
      'e8ac': 0, 'e8ca': 1, 'ea8c': 1, 'eac8': 0, 'ec8a': 0, 'eca8': 1
    };

    const blackCornerParityMap = {
      '1357': 0, '1375': 1, '1537': 1, '1573': 0, '1735': 0, '1753': 1,
      '3157': 1, '3175': 0, '3517': 0, '3571': 1, '3715': 1, '3751': 0,
      '5137': 0, '5173': 1, '5317': 1, '5371': 0, '5713': 0, '5731': 1,
      '7135': 1, '7153': 0, '7315': 0, '7351': 1, '7513': 1, '7531': 0
    };

    const whiteCornerParityMap = {
      '9bdf': 1, '9bfd': 0, '9dbf': 0, '9dfb': 1, '9fbd': 1, '9fdb': 0,
      'b9df': 0, 'b9fd': 1, 'bd9f': 1, 'bdf9': 0, 'bf9d': 0, 'bfd9': 1,
      'd9bf': 1, 'd9fb': 0, 'db9f': 0, 'dbf9': 1, 'df9b': 1, 'dfb9': 0,
      'f9bd': 0, 'f9db': 1, 'fb9d': 1, 'fbd9': 0, 'fd9b': 0, 'fdb9': 1
    };

    const defaultShapePatterns = {
      '01010101': 'Square',
      '00101101': 'Kite',
      '00110011': 'Barrel',
      '00110101': 'Left Fist',
      '00101011': 'Right Fist',
      '00100111': 'Shield',
      '00011011': 'Muffin',
      '00010111': 'Left Pawn',
      '01000111': 'Right Pawn',
      '00001111': 'Scallop',
      '0011111': 'Pair',
      '0101111': 'L-Shape',
      '0111011': 'Line',
      '000000111': '6-0',
      '010000011': 'Right 5-1',
      '000001011': 'Left 5-1',
      '001000011': 'Right 4-2',
      '000010011': 'Left 4-2',
      '000010101': '4-1-1',
      '000100011': '3-3',
      '010010001': '3-1-2',
      '010001001': '3-2-1',
      '001001001': '2-2-2',
      '0000000011': '8-0',
      '0000001001': '6-2',
      '0000100001': '4-4',
      '0000000101': '7-1',
      '0000010001': '5-3',
      '111111': 'Star'
    };

    function parseScramble(scramble) {
      const moves = [];
      let i = 0;
      while (i < scramble.length) {
        const char = scramble[i];
        if (char === '/' || char === '\\') {
          moves.push({ type: 'twist' });
          i++;
        } else if (char === '(' || char === '-' || /\d/.test(char)) {
          let moveStr = '';
          let parenDepth = 0;
          while (i < scramble.length) {
            const c = scramble[i];
            if (c === '(') parenDepth++;
            if (c === ')') parenDepth--;
            if (c === '/' || c === '\\') break;
            if ((c === ',' || c === '-' || /\d/.test(c) || c === '(' || c === ')') && parenDepth >= 0) {
              moveStr += c;
            }
            i++;
            if (parenDepth === 0 && moveStr.includes(',')) break;
          }
          const cleaned = moveStr.replace(/[()]/g, '').trim();
          if (cleaned.includes(',')) {
            const parts = cleaned.split(',').map(n => parseInt(n.trim(), 10));
            moves.push({ type: 'turn', top: parts[0], bottom: parts[1] });
          }
        } else {
          i++;
        }
      }
      return moves;
    }

    function hexTwist(tlHex, blHex) {
      return {
        tlHex: tlHex.slice(0, 6) + blHex.slice(0, 6),
        blHex: tlHex.slice(6) + blHex.slice(6)
      };
    }

    function hexCycleLeft(hex, places) {
      const n = ((places % 12) + 12) % 12;
      return hex.slice(n) + hex.slice(0, n);
    }

    function scrambleToHex(scramble) {
      let tlHex = '011233455677';
      let blHex = '998bbaddcffe';
      for (const move of parseScramble(scramble)) {
        if (move.type === 'twist') {
          ({ tlHex, blHex } = hexTwist(tlHex, blHex));
        } else if (move.type === 'turn') {
          tlHex = hexCycleLeft(tlHex, move.top);
          blHex = hexCycleLeft(blHex, move.bottom);
        }
      }
      return { tlHex, blHex };
    }

    function deDuplicateRightToLeft(raw) {
      const units = [];
      let bits = '';
      let i = raw.length - 1;
      while (i >= 0) {
        const c = raw[i].toLowerCase();
        units.push(c);
        if (CORNER_HEX.has(c)) {
          bits += '1';
          i -= 2;
        } else {
          bits += '0';
          i -= 1;
        }
      }
      return { units, bits };
    }

    function deDuplicateBottomIntended(blHex) {
      return deDuplicateRightToLeft(blHex);
    }

    function deDuplicateBottomRefactorCurrent(blHex) {
      const blRaw = blHex.slice(0, 6).split('').reverse().join('') +
        blHex.slice(6).split('').reverse().join('');
      return deDuplicateRightToLeft(blRaw);
    }

    function rotateString(value, amount) {
      const n = value.length;
      const k = ((amount % n) + n) % n;
      return value.slice(k) + value.slice(0, k);
    }

    function rotateArray(value, amount) {
      const n = value.length;
      const k = ((amount % n) + n) % n;
      return value.slice(k).concat(value.slice(0, k));
    }

    function matchPattern(bitStr) {
      for (const [pattern, name] of Object.entries(defaultShapePatterns)) {
        if (pattern.length !== bitStr.length) continue;
        const order = [0];
        for (let distance = 1; distance < bitStr.length; distance++) {
          order.push(-distance, distance);
        }
        for (const rawRotation of order) {
          const rotation = ((rawRotation % bitStr.length) + bitStr.length) % bitStr.length;
          if (rotateString(bitStr, rotation) === pattern) {
            return { name, pattern, rotation };
          }
        }
      }
      return { name: 'Unknown', pattern: bitStr, rotation: 0 };
    }

    function groupPieces(topRotated, bottomRotated) {
      const combined = topRotated.concat(bottomRotated);
      return {
        blackEdges: combined.filter(piece => TOP_EDGES.has(piece)).join(''),
        whiteEdges: combined.filter(piece => BOTTOM_EDGES.has(piece)).join(''),
        blackCorners: combined.filter(piece => TOP_CORNERS.has(piece)).join(''),
        whiteCorners: combined.filter(piece => BOTTOM_CORNERS.has(piece)).join('')
      };
    }

    function countEdgesAndCorners(units) {
      const edges = units.filter(piece => !CORNER_HEX.has(piece)).length;
      return { edges, corners: units.length - edges };
    }

    function getParityOrder(topRotated, bottomRotated, z2TracingMode) {
      const topCount = countEdgesAndCorners(topRotated);
      const bottomCount = countEdgesAndCorners(bottomRotated);
      const shouldSwap = z2TracingMode &&
        ((topCount.edges === 2 && topCount.corners === 5 && bottomCount.edges === 6 && bottomCount.corners === 3) ||
         (topCount.edges === 0 && topCount.corners === 6 && bottomCount.edges === 8 && bottomCount.corners === 2));

      return {
        shouldSwap,
        topCount,
        bottomCount,
        first: shouldSwap ? bottomRotated : topRotated,
        second: shouldSwap ? topRotated : bottomRotated
      };
    }

    function colorString(hexString, colorMap) {
      return hexString.split('').map(piece => colorMap[piece] || '?').join('');
    }

    function modalColorString(hexString, colorMap) {
      return colorString(hexString, colorMap).slice(0, 3);
    }

    function displayValue(value) {
      return typeof value === 'undefined' ? 'undefined' : String(value);
    }

    function layerString(hexString) {
      return hexString.split('').map(piece => TOP_HEX.has(piece) ? 'B' : 'W').join('');
    }

    function buildParityDiagnostics(topRotated, bottomRotated, groups, colorMap) {
      const allEdges = [];
      const allCorners = [];
      for (const piece of topRotated.concat(bottomRotated)) {
        if (CORNER_HEX.has(piece)) allCorners.push(piece);
        else allEdges.push(piece);
      }

      const line1 = blackEdgeParityMap[groups.blackEdges];
      const line2 = whiteEdgeParityMap[groups.whiteEdges];
      const line3 = blackCornerParityMap[groups.blackCorners];
      const line4 = whiteCornerParityMap[groups.whiteCorners];

      const oddEdges = [allEdges[0], allEdges[2], allEdges[4], allEdges[6]].filter(Boolean);
      const oddCorners = [allCorners[0], allCorners[2], allCorners[4], allCorners[6]].filter(Boolean);
      const line5TopCount = oddEdges.filter(piece => TOP_HEX.has(piece)).length;
      const line6TopCount = oddCorners.filter(piece => TOP_HEX.has(piece)).length;
      const line5 = (line5TopCount === 1 || line5TopCount === 3) ? 1 : 0;
      const line6 = (line6TopCount === 1 || line6TopCount === 3) ? 1 : 0;

      const lines = [line1, line2, line3, line4, line5, line6];
      const total = lines.reduce((sum, value) => sum + value, 0);

      return {
        tableText: [
          `line 1 black edges ${groups.blackEdges} -> ${displayValue(line1)}`,
          `line 2 white edges ${groups.whiteEdges} -> ${displayValue(line2)}`,
          `line 3 black corners ${groups.blackCorners} -> ${displayValue(line3)}`,
          `line 4 white corners ${groups.whiteCorners} -> ${displayValue(line4)}`,
          `total: ${Number.isNaN(total) ? 'NaN' : total} -> ${total % 2 === 1 ? 'Odd' : 'Even'}`
        ].join('; '),
        modalText: [
          `line 1: ${modalColorString(groups.blackEdges, colorMap)}`,
          `line 2: ${modalColorString(groups.whiteEdges, colorMap)}`,
          `line 3: ${modalColorString(groups.blackCorners, colorMap)}`,
          `line 4: ${modalColorString(groups.whiteCorners, colorMap)}`
        ].join('; '),
        oddLineText: [
          `line 5 odd edges ${oddEdges.join('')} (${layerString(oddEdges.join(''))}) black-count ${line5TopCount} -> ${line5}`,
          `line 6 odd corners ${oddCorners.join('')} (${layerString(oddCorners.join(''))}) black-count ${line6TopCount} -> ${line6}`
        ].join('; ')
      };
    }

    function buildWorkflow(scramble, cornerMode, z2TracingMode, bottomMode) {
      const input = scramble.trim();
      const hex = scrambleToHex(input);
      const top = deDuplicateRightToLeft(hex.tlHex);
      const bottom = bottomMode === 'refactor-current'
        ? deDuplicateBottomRefactorCurrent(hex.blHex)
        : deDuplicateBottomIntended(hex.blHex);
      const topMatch = matchPattern(top.bits);
      const bottomMatch = matchPattern(bottom.bits);
      const topRotated = rotateArray(top.units, topMatch.rotation);
      const bottomRotated = rotateArray(bottom.units, bottomMatch.rotation);
      const parityOrder = getParityOrder(topRotated, bottomRotated, z2TracingMode);
      const groups = groupPieces(parityOrder.first, parityOrder.second);
      const topPattern = rotateString(top.bits, topMatch.rotation);
      const bottomPattern = rotateString(bottom.bits, bottomMatch.rotation);
      const shapeComment = topMatch.name === 'Unknown' || bottomMatch.name === 'Unknown'
        ? '(does not fully match known shape patterns)'
        : `(yayyyyy, matches with ${topPattern}|${bottomPattern}, ${topMatch.name.toLowerCase()} ${bottomMatch.name.toLowerCase()})`;
      const colorMap = cornerMode === 'clockwise' ? hexToColorsCW : hexToColorsCCW;
      const parity = buildParityDiagnostics(parityOrder.first, parityOrder.second, groups, colorMap);
      const orderLabel = parityOrder.shouldSwap ? 'bottom then top (z2 tracing swap)' : 'top then bottom';

      return [
        `1. input: ${input}`,
        `2. scramble to hex: ${hex.tlHex}|${hex.blHex}`,
        `3. inversion and corner de-duplication (${bottomMode}): ${top.units.join('')}|${bottom.units.join('')}`,
        `4. shape matching: ${topRotated.join('')}|${bottomRotated.join('')} ${shapeComment}`,
        `5. grouping (${orderLabel}): black edges: ${groups.blackEdges}; white edges: ${groups.whiteEdges}; black corners: ${groups.blackCorners}; white corners: ${groups.whiteCorners}`,
        `6. parity table testing: ${parity.tableText}`,
        `7. colors to show in modal (${cornerMode}): ${parity.modalText}`,
        `8. line 5 and 6 parity testing: ${parity.oddLineText}`,
        '9. showing in the modal'
      ].join('\n');
    }

    const inputEl = document.getElementById('scrambleInput');
    const outputEl = document.getElementById('output');
    const runBtn = document.getElementById('runBtn');
    const copyBtn = document.getElementById('copyBtn');
    const cornerModeEl = document.getElementById('cornerMode');
    const z2TracingModeEl = document.getElementById('z2TracingMode');
    const bottomModeEl = document.getElementById('bottomMode');

    function runWorkflow() {
      try {
        outputEl.textContent = buildWorkflow(inputEl.value, cornerModeEl.value, z2TracingModeEl.checked, bottomModeEl.value);
      } catch (error) {
        outputEl.textContent = `Error: ${error.message}`;
      }
    }

    runBtn.addEventListener('click', runWorkflow);
    cornerModeEl.addEventListener('change', runWorkflow);
    z2TracingModeEl.addEventListener('change', runWorkflow);
    bottomModeEl.addEventListener('change', runWorkflow);
    inputEl.addEventListener('keydown', event => {
      if ((event.ctrlKey || event.metaKey) && event.key === 'Enter') runWorkflow();
    });
    copyBtn.addEventListener('click', async () => {
      await navigator.clipboard.writeText(outputEl.textContent);
    });

    runWorkflow();
  </script>
</body>
</html>
