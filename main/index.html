<!DOCTYPE html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Square-1 Cubeshape Parity Trainer - Learn all 90 cubeshape parity cases with dynamic analysis and personalized tracking"
    />
    <meta name="theme-color" content="#007bff" />
    <title>SquanGo CSP</title>
    <link rel="stylesheet" href="/styles.css" />
    <link rel="stylesheet" href="/training-modal.css" />
    <link rel="stylesheet" href="/quick-edit.css" />
    <link rel="stylesheet" href="/svg-editor.css" />
    <link rel="icon" type="image/png" sizes="32x32" href="/res/icons/icon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/res/icons/icon-16.png" />
    <link rel="icon" href="/favicon.ico" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <script>
      (function () {
        let saved = localStorage.getItem('sqg-csp-theme');
        if (saved === 'dark' || saved === 'light') {
          document.documentElement.setAttribute('data-theme', saved);
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
