<!DOCTYPE html>
<html lang="en" data-theme="light">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
        content="Square-1 Cubeshape Parity Trainer - Learn all 90 cubeshape parity cases with dynamic analysis and personalized tracking">
    <meta name="theme-color" content="#007bff">
    <title>SquanGo CSP</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/training-modal.css">
    <link rel="stylesheet" href="css/quick-edit.css">
    <link rel="stylesheet" href="css/svg-editor.css">
    <link rel="icon" type="image/png" sizes="32x32" href="res/icons/icon-32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="res/icons/icon-16.png">
    <link rel="icon" href="favicon.ico">

    <!--
        FOUC PREVENTION — must run before first paint.
        Reads localStorage and stamps data-theme on <html>
        so the correct theme variables apply immediately.
    -->
    <script>
        (function () {
            let saved = localStorage.getItem('sqg-csp-theme');
            if (saved === 'dark' || saved === 'light') {
                document.documentElement.setAttribute('data-theme', saved);
            }
        })();
    </script>
</head>

<body>
    <div id="loadingScreen" class="loading-screen">
        <h1 id="loadingTitle" class="loading-title">SquanGo CSP</h1>
        <p id="loadingAuthor" class="loading-author">by Abid Ibn Ashraf</p>
        <div id="loadingTipContainer"></div>
        <div id="loadingBarContainer" class="loading-bar-container">
            <div id="loadingProgress" class="loading-bar-progress"></div>
        </div>
    </div>

    <div class="container hidden-until-loaded" id="mainContainer">
        <header>
            <h1 class="desktop-title">SquanGo CSP</h1>
            <h1 class="tablet-title">SquanGo CSP</h1>
            <h1 class="mobile-title">SquanGo CSP</h1>
            <div class="subtitle">By Abid Ibn Ashraf</div>
            <button id="sidebarToggleBtn" class="sidebar-toggle-btn" aria-label="Menu">
                <img src="res/menu.svg" height="24px" width="24px">
            </button>

            <button id="profileBtn" class="floating-profile-btn" aria-label="Profile"
                onclick="event.stopPropagation();">
                <img id="profileBtnAvatar" src="res/avatar.svg" height="24px" width="24px">
            </button>
        </header>

        <div class="controls">
            <button id="searchToggle" class="search-toggle-btn search-toggle-icon-btn" aria-label="Toggle Search">
                <img src="res/search.svg" height="22px" width="22px">
            </button>
            <input type="text" id="search" placeholder="Search cubeshapes...">
            <select id="sort">
                <option value="priority" id="sortPriority" data-short="Priority" data-xs="Priority">By Priority</option>
                <option value="probability" selected data-short="Highest Probability" data-xs="Highest prob.">Highest
                    Probability</option>
                <option value="antiProbability" data-short="Lowest Probability" data-xs="Lowest Prob.">Lowest
                    Probability</option>
            </select>
            <select id="learnFilter">
                <option value="all" data-short="All" data-xs="All">Show All</option>
                <option value="learned" data-short="Learned" data-xs="✓">Show Only Learned</option>
                <option value="unlearned" data-short="Unlearned" data-xs="✗">Exclude Learned</option>
            </select>
        </div>

        <div class="grid" id="grid"></div>

        <footer>
            <p>Please contact for any edits.</p>
        </footer>
    </div>

    <script src="res/shapeImages/svg.js"></script>
    <script src="database/shapeIndex.js"></script>
    <script src="database/algs.js"></script>
    <script src="js/tools/scrambleNormalizer.js"></script>
    <script src="js/tools/alg_to_index.js"></script>
    <script src="js/tools/cale's-parity-tracer.js"></script>
    <script src="js/tools/svg-editor.js"></script>
    <script src="js/tools/scramblegenerator.js"></script>
    <script src="js/tools/draw-scramble.js"></script>
    <script src="js/tools/scrambleFormatting.js"></script>
    <script src="js/tools/animate-alg.js"></script>
    <script src="js/restoftheapp.js"></script>
    <script src="js/tools/shapeTracer.js"></script>
    <script src="js/rendering.js"></script>
    <script src="js/search-and-filter.js"></script>
    <script src="js/tools/scrambled-state-generator.js"></script>
    <script src="js/settings.js"></script>
    <script src="js/modals.js"></script>
    <script src="js/quick-edit.js"></script>
    <script src="js/training-modal.js"></script>
    <script src="js/multi-trainer.js"></script>
    <script src="js/index.js"></script>
</body>

</html>
