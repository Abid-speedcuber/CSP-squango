<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
        content="Square-1 Cubeshape Parity Trainer - Learn all 90 cubeshape parity cases with dynamic analysis and personalized tracking">
    <meta name="theme-color" content="#007bff">
    <title>Square-1 Cubeshape Parity</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/training-modal.css">
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="apple-touch-icon" href="res/icon-192.png">
</head>

<body>
    <div id="loadingScreen"
        style="position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: white; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 99999; font-family: 'Segoe UI', sans-serif;">
        <h1 style="font-size: 2.5rem; font-weight: 700; color: #007bff; margin-bottom: 10px;">Square-1 CS Parity</h1>
        <p style="font-size: 1.2rem; color: #666; margin-bottom: 30px;">by Abid Ibn Ashraf</p>
        <div style="width: 300px; height: 8px; background: #e0e0e0; border-radius: 4px; overflow: hidden;">
            <div id="loadingProgress"
                style="width: 0%; height: 100%; background: linear-gradient(90deg, #007bff, #17a2b8); transition: width 0.3s ease;">
            </div>
        </div>
    </div>
    <script>
        // Calculate scrollbar width and set CSS variable
        function setScrollbarWidth() {
            const scrollbarWidth = window.innerWidth - document.documentElement.clientWidth;
            document.documentElement.style.setProperty('--scrollbar-width', scrollbarWidth + 'px');
        }
        setScrollbarWidth();
        window.addEventListener('resize', setScrollbarWidth);
    </script>
    <div class="container" style="opacity: 0; transition: opacity 0.3s ease;">
        <header>
            <h1 class="desktop-title">SquanGo CSP</h1>
            <h1 class="tablet-title">SquanGo CSP</h1>
            <h1 class="mobile-title">SquanGo CSP</h1>
            <div class="subtitle">By Abid Ibn Ashraf</div>
            <div id="floatingButtonsContainer" class="floating-buttons-container">
                <button id="menuBtn" class="floating-settings-btn" aria-label="Menu"><img
                        src="res/menu.svg" height="24px" width="24px"></button>
                <button class="menu-action-btn" onclick="openSettingsModal(); collapseMenu();"><img src="res/settings.svg"></button>
                <button class="menu-action-btn" onclick="openNewParityAnalysis(''); collapseMenu();"><img src="res/tracer.svg"></button>
                <button class="menu-action-btn" onclick="openGeneralNotesModal(); collapseMenu();"><img src="res/notes.svg"></button>
                <button class="menu-action-btn instruction-btn" onclick="showHomepageInfoModal(); collapseMenu();"><img src="res/info.svg"></button>
            </div>
        </header>

        <div class="topbar">
            <div style="text-align: center;">
                <div class="desktop-stats" style="margin-bottom: 8px; font-size: 1.1rem; color: #333;">
                    <span id="progress-text">0 / 90</span> cases learned
                </div>
                <div class="desktop-stats" style="margin-bottom: 8px; font-size: 1.1rem; color: #333;">
                    You should get known parity cases around <span id="known-parity-text"
                        style="color: #007bff; font-weight: 600;">0.000%</span> of the solves
                </div>
                <div class="desktop-stats" style="font-size: 1.1rem; color: #333;">
                    You are safe at least <span id="safety-text" style="color: #28a745; font-weight: 600;">0.000%</span>
                    of the times
                </div>
                <div class="mobile-stats" style="font-size: 0.9rem; color: #333; text-align: center;">
                    <span id="progress-text-mobile">0/90</span> • Coverage: <span id="known-parity-text-mobile"
                        style="color: #007bff; font-weight: 600;">0%</span> • Safe: <span id="safety-text-mobile"
                        style="color: #28a745; font-weight: 600;">0%</span>
                </div>
                <!--<div style="margin-top: 15px;">
            <button onclick="exportData()" style="padding: 8px 16px; margin-right: 10px; background: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer;">Export Data</button>
            <label style="padding: 8px 16px; background: #28a745; color: white; border-radius: 4px; cursor: pointer; display: inline-block;">
                Import Data
                <input type="file" id="importFile" accept=".json" style="display: none;" onchange="handleFileImport(this.files[0])">
            </label>
        </div>-->
            </div>
        </div>

        <div class="controls">
            <button id="searchToggle" class="search-toggle-btn"
                style="background-color:white; color:black; height:35px; width:35px;" aria-label="Toggle Search">
                <img src="res/search.svg" height="22px" width="22px">
            </button>
            <input type="text" id="search" placeholder="Search cubeshapes...">
            <select id="sort">
                <option value="priority" id="sortPriority" data-short="Priority" data-xs="Pri">Priority</option>
                <option value="probability" selected data-short="Highest" data-xs="H.P.">Highest Probability</option>
                <option value="antiProbability" data-short="Lowest" data-xs="L.P.">Lowest Probability</option>
            </select>
            <select id="learnFilter">
                <option value="all" data-short="All" data-xs="All">Show All</option>
                <option value="learned" data-short="Learned" data-xs="✓">Show Only Learned</option>
                <option value="unlearned" data-short="Unlearned" data-xs="✗">Exclude Learned</option>
            </select>
        </div>

        <div class="grid" id="grid"></div>

        <footer>
            <p>Please contact for any edits.</p>
        </footer>
    </div>

    <script src="res/shapeImages/svg.js"></script>
    <script src="database/shapeIndex.js"></script>
    <script src="database/algs.js"></script>
    <script src="js/tools/cale's-parity-tracer.js"></script>
    <script src="js/tools/svg-editor.js"></script>
    <script src="js/tools/scramblegenerator.js"></script>
    <script src="js/tools/draw-scramble.js"></script>
    <script src="js/tools/scrambleFormatting.js"></script>
    <script src="js/restoftheapp.js"></script>
    <script src="js/tools/shapeTracer.js"></script>
    <script src="js/rendering.js"></script>
    <script src="js/search-and-filter.js"></script>
    <script src="js/tools/scrambled-state-generator.js"></script>
    <script src="js/modals.js"></script>
    <script src="js/training-modal.js"></script>

    <script>
        document.addEventListener('keydown', function (e) {
            if (e.key === 'Escape') {
                closeModal();
            }
        });

        // Drag and drop support
        document.body.addEventListener('dragover', (e) => {
            e.preventDefault();
        });

        document.body.addEventListener('drop', (e) => {
            e.preventDefault();
            const files = e.dataTransfer.files;
            if (files.length > 0 && files[0].name.endsWith('.json')) {
                handleFileImport(files[0]);
            }
        });

        // Close modals when clicking outside (wait for modals to be generated)
        window.onclick = function (event) {
            // Use setTimeout to ensure modals are generated
            setTimeout(() => {
                const settingsModal = document.getElementById('settingsModal');
                const caseNameModal = document.getElementById('caseNameModal');
                const suggestModal = document.getElementById('suggestModal');
                const confessionModal = document.getElementById('confessionModal');
                const colorSchemeModal = document.getElementById('colorSchemeModal');
                const trainingModal = document.getElementById('trainingModal');

                if (event.target == settingsModal) {
                    closeSettingsModal();
                }
                if (event.target == caseNameModal) {
                    closeCaseNameModal();
                }
                if (event.target == colorSchemeModal) {
                    closeColorSchemeModal();
                }
                if (trainingModal && event.target == trainingModal) {
                    closeTrainingModal();
                }

                if (event.target == suggestModal) {
                    closeSuggestModal();
                }
                if (event.target == confessionModal) {
                    closeConfessionModal();
                }
            }, 0);
        }

        // Unified back button handler
        const modalStack = [];

        function pushModalState(modalId, closeFunction) {
            modalStack.push({ id: modalId, close: closeFunction });
            window.history.pushState({ modalId: modalId }, '');
        }

        function popModalState() {
            if (modalStack.length > 0) {
                return modalStack.pop();
            }
            return null;
        }

        window.addEventListener('popstate', function (event) {
            if (modalStack.length > 0) {
                const modal = popModalState();
                if (modal && modal.close) {
                    modal.close();
                }
            }
        });

        // Wait for DOM to be ready before generating modals
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', () => {
                generateModalHTML();
            });
        } else {
            generateModalHTML();
        }

        // Ensure DOM is ready before initialization
        function initializeApp() {
            // Initialize DOM references
            initializeDOMReferences();

            // Set default sort value if first load
            if (isFirstLoad && sortSelect) {
                sortSelect.value = 'probability';
            }
        }

        // Call initialization after DOM is ready
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', initializeApp);
        } else {
            initializeApp();
        }

        // Loading tips object
        const loadingTips = {
            firstLoad: [
                "Reading the 'How to Use' instructions can help you discover hidden features of the app.",
            ],
            general: [
                "Happy Learning.",
            ]
        };

        // Select and display a random tip
        const tipElement = document.createElement('p');
        tipElement.style.cssText = 'font-size: 0.95rem; color: #555; margin-top: 20px; max-width: 500px; text-align: center; line-height: 1.5;';
        const tips = isFirstLoad ? loadingTips.firstLoad : loadingTips.general;
        const randomTip = tips[Math.floor(Math.random() * tips.length)];
        tipElement.textContent = randomTip;
        document.getElementById('loadingScreen').appendChild(tipElement);

        // Loading screen progress simulation
        let loadProgress = 0;
        const progressBar = document.getElementById('loadingProgress');
        const loadingInterval = setInterval(() => {
            loadProgress += Math.random() * 30;
            if (loadProgress > 90) loadProgress = 90;
            progressBar.style.width = loadProgress + '%';
        }, 100);

        // Wait for DOM before calling these functions
        function finalizeInitialization() {

            // Setup menu button
            const menuBtn = document.getElementById('menuBtn');
            const menuContainer = document.getElementById('floatingButtonsContainer');
            if (menuBtn && menuContainer) {
                menuBtn.onclick = (e) => {
                    e.stopPropagation();
                    menuContainer.classList.toggle('expanded');
                };
                
                // Close menu when clicking outside
                document.addEventListener('click', (e) => {
                    if (!menuContainer.contains(e.target)) {
                        menuContainer.classList.remove('expanded');
                    }
                });
            }
            
            // Collapse menu function
            window.collapseMenu = function() {
                const menuContainer = document.getElementById('floatingButtonsContainer');
                if (menuContainer) {
                    menuContainer.classList.remove('expanded');
                }
            };

            // Apply instruction button visibility
            if (hideInstructions) {
                const container = document.getElementById('floatingButtonsContainer');
                if (container) {
                    container.classList.add('hide-instructions');
                }
            }
            if (typeof applyInstructionVisibility === 'function') {
                applyInstructionVisibility();
            }

            // These need to run after modal generation
            setTimeout(() => {
                updateProgress();
                filterAndSort(true); // Soft render on initialization
            }, 100);
        }

        // Ensure this runs after DOM is ready
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', () => {
                finalizeInitialization();
                // Set saved sort mode
                const sortSelect = document.getElementById('sort');
                if (sortSelect && currentSortMode) {
                    sortSelect.value = currentSortMode;
                }
            });
        } else {
            finalizeInitialization();
            // Set saved sort mode
            const sortSelect = document.getElementById('sort');
            if (sortSelect && currentSortMode) {
                sortSelect.value = currentSortMode;
            }
        }

        window.addEventListener('load', async () => {
            // Initialize SVGs FIRST - after svg.js is guaranteed to be loaded
            initializeSVGData();
            
            // Set saved sort mode before parity calculation
            const sortSelect = document.getElementById('sort');
            if (sortSelect && currentSortMode) {
                sortSelect.value = currentSortMode;
            }
            
            // Calculate parity only if needed (settings changed or first load)
            if (needsParityRecalculation()) {
                console.log('Parity settings changed, recalculating...');
                calculateAndCacheAllParity();
            } else {
                console.log('Using cached parity calculations');
            }
            
            await new Promise(resolve => setTimeout(resolve, 300));

            clearInterval(loadingInterval);
            progressBar.style.width = '100%';

            await new Promise(resolve => setTimeout(resolve, 200));

            document.getElementById('loadingScreen').style.opacity = '0';
            document.querySelector('.container').style.opacity = '1';

            await new Promise(resolve => setTimeout(resolve, 300));

            document.getElementById('loadingScreen').style.display = 'none';
        });


        // Register service worker (only in http/https, not file://)
        if ('serviceWorker' in navigator && (window.location.protocol === 'http:' || window.location.protocol === 'https:')) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/serviceworker.js')
                    .then(registration => {
                    })
                    .catch(err => {
                    });
            });
        }
    </script>
</body>

</html>
