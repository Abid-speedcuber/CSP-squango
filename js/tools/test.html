<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Parity Debug</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f0f2f5;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }
    h2 {
      margin-bottom: 20px;
      font-size: 1rem;
      color: #666;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }
    .tabs {
      display: flex;
      gap: 8px;
      margin-bottom: -1px;
      position: relative;
      z-index: 1;
    }
    .tab-btn {
      padding: 8px 20px;
      border: 1px solid #d0d5dd;
      border-bottom: none;
      background: #e4e7ec;
      color: #667085;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      border-radius: 8px 8px 0 0;
      transition: all 0.15s;
    }
    .tab-btn:hover { background: #eef0f4; color: #344054; }
    .tab-btn.active {
      background: #ffffff;
      color: #1d2939;
      border-color: #d0d5dd;
    }
    .modal-wrapper {
      background: #ffffff;
      border: 1px solid #d0d5dd;
      border-radius: 0 12px 12px 12px;
      padding: 24px;
      width: 100%;
      max-width: 640px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.10);
    }
    .scramble-label {
      font-size: 0.75rem;
      color: #888;
      font-family: monospace;
      word-break: break-all;
      margin-bottom: 16px;
      background: #f8f9fb;
      padding: 8px 10px;
      border-radius: 6px;
      border: 1px solid #e4e7ec;
    }
    .modal-slot { width: 100%; }
  </style>
</head>
<body>

<h2>Parity Tracer — Live Debug</h2>

<div class="tabs">
  <button class="tab-btn active" onclick="switchTab(0)">Case 1</button>
  <button class="tab-btn" onclick="switchTab(1)">Case 2</button>
  <button class="tab-btn" onclick="switchTab(2)">Case 3</button>
  <button class="tab-btn" onclick="switchTab(3)">Case 4</button>
</div>

<div class="modal-wrapper">
  <div class="scramble-label" id="scramble-label"></div>
  <div class="modal-slot" id="modal-slot"></div>
</div>

<script src="cale's-parity-tracer.js"></script>
<script src="draw-scramble.js"></script>
<script>
  window.cornerStickerMode = 'counterclockwise';
  window.setCornerStickerMode = function(mode) { window.cornerStickerMode = mode; };
</script>
<script src="scrambleNormalizer.js"></script>
<script>
  const scrambles = [
    "(-5,0)/ (-1,-1)/ (-3,3)/ (0,-3)/ (6,0)/ (-5,0)/ (3,0)/ (-4,-5)/ (0,-2)/ (4,-4)/ (-4,-3)/ (0,-3)/ (-2,0)/",
    "(1,0)/ (3,-3)/ (5,-1)/ (4,-5)/ (6,0)/ (-1,0)/ (3,0)/ (-3,0)/ (0,-4)/ (4,-4)/ (2,0)/ (-3,-2)",
    "(4,0)/ (2,-1)/ (0,3)/ (6,0)/ (-3,0)/ (1,-2)/ (5,0)/ (0,-3)/ (0,-1)/ (-3,0)/ (4,0)/ (4,0)/ (0,-2)/ (-4,0)",
    "(0,5)/ (4,4)/ (-3,6)/ (0,-3)/ (5,-4)/ (6,-5)/ (0,-3)/ (3,-3)/ (5,0)/ (0,-4)/ (-5,0)/ (0,-4)/ (4,0)/",
  ];

  let currentTab = 0;
  let activeBackdrop = null;

  function switchTab(idx) {
    // Update tab styles
    document.querySelectorAll('.tab-btn').forEach((btn, i) => {
      btn.classList.toggle('active', i === idx);
    });

    currentTab = idx;
    openModal(idx);
  }

  function openModal(idx) {
    const scr = scrambles[idx];
    document.getElementById('scramble-label').textContent = scr;

    // Clean up previous modal backdrop if any
    if (activeBackdrop && activeBackdrop.parentNode) {
      activeBackdrop.remove();
      activeBackdrop = null;
    }

    // Clear slot
    const slot = document.getElementById('modal-slot');
    slot.innerHTML = '';

    // Check if library is loaded
    if (!window.ParityTracerLibrary || !window.ParityTracerLibrary.createModal) {
      console.error('ParityTracerLibrary not loaded yet!');
      slot.innerHTML = '<div style="color: red; padding: 20px;">Error: Parity Tracer library not loaded. Please refresh the page.</div>';
      return;
    }

    // Open parity tracer modal
    const backdrop = window.ParityTracerLibrary.createModal({
      backgroundColor: '#ffffff',
      scrambleText: scr,
      topColor: '#FFD700',
      topColorName: 'Yellow',
      topColorShort: 'Y',
      bottomColor: '#FFFFFF',
      bottomColorName: 'White',
      bottomColorShort: 'W',
      frontColor: '#CC0000',
      rightColor: '#00AA00',
      backColor: '#FF8C00',
      leftColor: '#0066CC',
      generateImage: true,
      imageSize: 200,
    });

    activeBackdrop = backdrop;

    // Yank the modal out of the backdrop and embed it inline
    const modalEl = backdrop.querySelector('.parity-tracer-modal-container');
    if (modalEl) {
      activeBackdrop = null;

      setTimeout(() => {
        backdrop.remove();

        modalEl.style.cssText = `
          position: relative;
          background: #ffffff;
          border-radius: 0;
          padding: 0;
          box-shadow: none;
          max-width: 100%;
          width: 100%;
          max-height: none;
          overflow-y: visible;
          z-index: auto;
        `;

        document.querySelectorAll(
          '.parity-tracer-close-btn, .parity-tracer-settings-btn, .parity-tracer-instruction-btn'
        ).forEach(btn => btn.remove());

        slot.appendChild(modalEl);
      }, 100);
    }
}

  // Auto-open case 1 on load
  window.addEventListener('load', () => {
    // Wait longer to ensure scripts are fully loaded
    setTimeout(() => {
      openModal(0);
    }, 250);
  });
</script>
</body>
</html>
